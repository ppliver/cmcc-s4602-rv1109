name: Build OpenIPC for S4602 (RV1109)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python-is-python3 device-tree-compiler u-boot-tools \
            wget xz-utils bc bison flex libssl-dev

      - name: Download OpenIPC official toolchain (rockchip-rv11xx)
        run: |
          wget -q https://github.com/openipc/firmware/releases/download/toolchain/toolchain.rockchip-rv11xx.tgz -O /tmp/toolchain.tgz
          mkdir -p /opt/openipc-toolchain
          tar xzf /tmp/toolchain.tgz -C /opt/openipc-toolchain
          echo "TOOLCHAIN_DIR=$(dirname $(find /opt/openipc-toolchain -name arm-openipc-linux-gnueabihf-gcc | head -1))" >> "$GITHUB_ENV"

      - name: Clone OpenIPC linux (rockchip-rv11xx)
        run: git clone --depth 1 --branch rockchip-rv11xx https://github.com/OpenIPC/linux.git /opt/linux

      - name: Inject SC5338 sensor driver into linux tree
        run: python3 "$GITHUB_WORKSPACE/tools/apply_kernel_patch.py" --linux /opt/linux

      - name: Download OpenIPC rv11xx generic kernel config (baseline)
        run: |
          # rv1109_lite_defconfig 的 BR2_LINUX_KERNEL_CUSTOM_CONFIG_FILE 即指向此文件，
          # 它是 OpenIPC 各 rv11xx 板的通用内核基线（不在 linux 树内，而在 firmware 仓库）。
          wget -q "https://raw.githubusercontent.com/OpenIPC/firmware/master/br-ext-chip-rockchip/board/rv11xx/rv1126.generic.config" -O /tmp/rv1126.generic.config
          ls -l /tmp/rv1126.generic.config

      - name: Build s4602 kernel (zImage)
        working-directory: /opt/linux
        env:
          CROSS_COMPILE: arm-openipc-linux-gnueabihf-
          ARCH: arm
          TOOLCHAIN_DIR: ${{ env.TOOLCHAIN_DIR }}
        run: |
          set -e
          # 注意：不能用 env: PATH 覆盖（${{ env.PATH }} 在 Actions 里为空，会清空系统 PATH）。
          # 改为在脚本内追加，保留 cp/make/bash 等宿主工具。
          export PATH="$TOOLCHAIN_DIR:$PATH"
          # 以官方 rv1109-nand-lite 基线配置为基底，再叠加 S4602 增量片段
          # （board/s4602/s4602_kernel_fragment.config 是唯一事实源，CI 与本地脚本共用）。
          cp /tmp/rv1126.generic.config .config
          MC=scripts/kconfig/merge_config.sh
          [ -f "$MC" ] || MC=scripts/merge_config.sh
          bash "$MC" -m .config "$GITHUB_WORKSPACE/board/s4602/s4602_kernel_fragment.config"
          make ARCH=arm olddefconfig
          make ARCH=arm -j"$(nproc)" zImage

      - name: Package FIT (zboot.img)
        run: |
          mkdir -p firmware
          bash tools/make_fit.sh /opt/linux/arch/arm/boot/zImage docs/evidence/vendor-kernel.dtb firmware/zboot.img

      - name: Download official nightly rootfs (rv1109-nand-lite)
        run: |
          wget -q https://github.com/openipc/firmware/releases/download/nightly/openipc.rv1109-nand-lite.tgz -O /tmp/rootfs.tgz
          tar xzf /tmp/rootfs.tgz -C /tmp
          cp /tmp/rootfs.ubi.rv1109 firmware/rootfs.ubi.rv1109
          ls -l firmware/zboot.img firmware/rootfs.ubi.rv1109

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openipc-s4602-rv1109
          path: |
            firmware/zboot.img
            firmware/rootfs.ubi.rv1109
          if-no-files-found: error
