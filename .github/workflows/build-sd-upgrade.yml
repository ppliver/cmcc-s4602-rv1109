name: build-sd-upgrade

# S4602 SD 升级固件整包复现：
#   入库源头 upgrade/factory/system_b.img (crc 0x38df701f, 原厂 mtd9)
#   → build_hook_image.sh（解包→注入 S99local v2→mksquashfs→ubinize→0xFF 填充）
#   → make_sd_upgrade.py（组装 base/optional + MANIFEST → out/s4602_sd_upgrade）
# 产物 artifact = SD 卡 FAT32 根目录的直接内容。

on:
  workflow_dispatch:
    inputs:
      use_rebuilt_rtp2pipe:
        description: "Package freshly-compiled rtp2pipe (source tools/rtp2pipe.c) instead of the device-verified binary"
        type: boolean
        default: false
      use_rebuilt_bins:
        description: "Also package freshly-compiled webd + h264out_v4 (gcc-version drift, bytes differ from device-verified builds)"
        type: boolean
        default: false
  push:
    paths:
      - "upgrade/**"
      - "tools/make_sd_upgrade.py"
      - ".github/workflows/build-sd-upgrade.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install repack toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools mtd-utils gcc-arm-linux-gnueabihf
          python3 -m pip install --quiet --user ubi-reader
          echo "PATH=$HOME/.local/bin:$PATH" >> "$GITHUB_ENV"
          mksquashfs -version | head -1
          arm-linux-gnueabihf-gcc --version | head -1

      - name: Rebuild binaries from source (rtp2pipe / webd / h264out_v4 / swapp_patched)
        run: |
          mkdir -p out/rebuilt_bins
          # rtp2pipe: static, no deps
          # TIME ABI: Ubuntu 24.04 (noble) switched its armhf port to 64-bit-time
          # by default -> plain compile links __ioctl_time64/__clock_gettime64,
          # which mangles v4l2 ioctl request codes -> VIDIOC_STREAMON EINVAL ->
          # h264out dies with "[FATAL] STREAMON failed" (verified on device).
          # Fix: force the classic ABI with -D_TIME_BITS=32 (verified 2026-11-19
          # on gcc 15.2/noble sysroot: time64 symbols gone, classic ioctl kept).
          # CAVEAT: do NOT use this flag with the OLD gcc-9.5 sysroot on the
          # build server 192.168.219.177 - there the toolchain default (32-bit)
          # is correct and the flag perversely ENABLES time64.
          # The symbol gates below still verify every produced binary.
          arm-linux-gnueabihf-gcc -O2 -std=gnu99 -w -static -s \
            -D_TIME_BITS=32 -D_FILE_OFFSET_BITS=32 \
            -o out/rebuilt_bins/rtp2pipe tools/rtp2pipe.c
          # webd: static, pure POSIX
          arm-linux-gnueabihf-gcc -O2 -std=gnu99 -w -static -s \
            -D_TIME_BITS=32 -D_FILE_OFFSET_BITS=32 \
            -o out/rebuilt_bins/webd tools/webd.c
          # h264out: PIE dynamic, vendor MPP headers (repo third_party/), runtime libs from rtlib.tar.gz
          arm-linux-gnueabihf-gcc -O2 -std=gnu99 -w -s \
            -D_TIME_BITS=32 -D_FILE_OFFSET_BITS=32 \
            -o out/rebuilt_bins/h264out_v4 tools/h264out.c \
            -Ithird_party/mpp/inc-1.0.9 -ldl -lpthread -lm
          for f in rtp2pipe webd h264out_v4; do
            F=$(file out/rebuilt_bins/$f); echo "$F"
            echo "$F" | grep -q "ELF 32-bit.*ARM" || { echo "FATAL: $f not ARM ELF"; exit 1; }
          done
          file out/rebuilt_bins/webd | grep -q "statically linked" || { echo "FATAL: webd not static"; exit 1; }
          file out/rebuilt_bins/h264out_v4 | grep -q "dynamically linked" || { echo "FATAL: h264out not dynamic"; exit 1; }
          # 32-bit time ABI gate: 64-bit time symbols break v4l2 ioctl on the device
          if strings out/rebuilt_bins/h264out_v4 | grep -qE '^__ioctl_time64$|^__clock_gettime64$'; then
            echo "FATAL: h264out_v4 linked 64-bit time ABI (__ioctl_time64) -> v4l2 STREAMON will fail"
            echo "       use a toolchain with 32-bit time default (gcc <= 12) or patch glibc headers"
            exit 1
          fi
          strings out/rebuilt_bins/h264out_v4 | grep -qE '^ioctl$' || { echo "FATAL: h264out_v4 missing 32-bit ioctl symbol"; exit 1; }
          echo "OK: h264out_v4 uses 32-bit time ABI (ioctl/clock_gettime)"
          # same time-ABI gate for webd (static): 64-bit time also breaks its ioctl use
          if strings out/rebuilt_bins/webd | grep -qE '^__ioctl_time64$|^__clock_gettime64$'; then
            echo "FATAL: webd linked 64-bit time ABI (__ioctl_time64)"
            exit 1
          fi
          echo "OK: webd uses 32-bit time ABI"
          # swapp_patched: byte-deterministic patch chain over the committed runtime swapp
          python3 tools/patch_swapp.py   # asserts base md5 + patched md5 488b51c2... == device-verified
          md5sum out/rebuilt_bins/*

      - name: Optionally substitute rebuilt binaries into package source
        if: ${{ inputs.use_rebuilt_rtp2pipe || inputs.use_rebuilt_bins }}
        run: |
          if [ "${{ inputs.use_rebuilt_rtp2pipe }}" = "true" ]; then
            cp out/rebuilt_bins/rtp2pipe upgrade/s4602_upgrade/optional/rtp2pipe
            echo "NOTE: shipping freshly-built rtp2pipe"
          fi
          if [ "${{ inputs.use_rebuilt_bins }}" = "true" ]; then
            cp out/rebuilt_bins/webd upgrade/s4602_upgrade/base/webd
            cp out/rebuilt_bins/h264out_v4 upgrade/s4602_upgrade/base/h264out_v4
            echo "NOTE: shipping freshly-built webd + h264out_v4"
          fi

      - name: Rebuild hook image v2 from factory source
        run: bash upgrade/build_hook_image.sh

      - name: Validate image geometry (ubireader)
        run: |
          IMG=upgrade/s4602_upgrade/flash/system_b.img
          test "$(stat -c%s $IMG)" = "46137344"
          ubireader_display_info $IMG | tee /tmp/ubi_info.txt
          grep -q "reserved_pebs: 332" /tmp/ubi_info.txt || { echo "FATAL: reserved_pebs != 332"; exit 1; }
          grep -q "1734217813" /tmp/ubi_info.txt || { echo "FATAL: wrong image seq"; exit 1; }
          tail -c 4096 $IMG | od -An -tx1 | grep -qv "00 00" || true
          python3 - <<'EOF'
          d = open("upgrade/s4602_upgrade/flash/system_b.img", "rb").read()
          assert len(d) == 46137344
          assert all(b == 0xFF for b in d[-4096:]), "tail not 0xFF"
          import zlib; print("image crc32 =", hex(zlib.crc32(d) & 0xFFFFFFFF))
          EOF

      - name: Assemble SD upgrade package
        run: python3 tools/make_sd_upgrade.py --verify

      - name: Sanity-check package layout
        run: |
          P=out/s4602_sd_upgrade
          test -f "$P/system_b.img"                # U-Boot fatload 必须在 FAT 根
          test -f "$P/s4602_upgrade/VERSION"
          test -f "$P/s4602_upgrade/MANIFEST.sizes"
          test "$(ls "$P/s4602_upgrade/base" | wc -l)" -eq 10
          test "$(ls "$P/s4602_upgrade/optional" | wc -l)" -eq 6
          bash -n "$P/s4602_upgrade/base/bootfix.sh"
          echo "package layout OK"

      - name: Record checksums
        run: |
          cd out/s4602_sd_upgrade
          find . -type f -exec md5sum {} \; | sort -k2 | tee MD5SUMS.txt
          cat s4602_upgrade/MANIFEST.sizes

      - uses: actions/upload-artifact@v4
        with:
          name: s4602_sd_upgrade_${{ github.run_number }}
          path: out/s4602_sd_upgrade/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: rebuilt_bins_${{ github.run_number }}
          path: out/rebuilt_bins/
          if-no-files-found: error
