name: Build S4602 rootfs from Firefly buildroot (Stage 2)

# 路线 P2 / docs/FIREFLY_BSP_BUILD_PLAN.md §7 —— Stage 2：
#   用 Firefly 公开 manifest（rv1126_rv1109_linux_release_20241011_v2.2.5g.xml）
#   repo sync SDK 仓库集，构建 buildroot rootfs（firefly_rv1126_rv1109_defconfig
#   全量基线 + S4602 覆盖），产物 rootfs.ext4 / rootfs.squashfs。
#   内核/zboot 仍走 build-firefly.yml（Stage 1 FIT），rootfs 通过 SD 卡 ext4
#   分区引导（bootm root=/dev/mmcblk1p2）。
#
# IQ 文件来自 S4602 vendor /system/resource/scene_param/COMMON_sc5338.xml
# （matfile 格式 rkaiq IQ，CMCC v1.55-1 调优），CI 注入 camera_engine_rkaiq/iqfiles。

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FL_GROUP: "https://gitlab.com/firefly-linux"
  SDK_DIR: /mnt/fl-sdk
  BR_TAG: "rv1126_rv1109/linux_release_v2.2.5g"

jobs:
  build-rootfs:
    runs-on: ubuntu-latest
    # Pin the whole build inside an ubuntu:22.04 container: this 2022-era SDK
    # needs gnu17-default gcc (12), glibc 2.35, python 3.10, cmake 3.22.
    # Hosted runner images keep moving (ubuntu-26.04/gc15 C23 caused 14 failed
    # rounds); the container freezes the environment at the SDK's era.
    container:
      image: ubuntu:22.04
    # container jobs default to sh (dash): 'set -o pipefail' is illegal there.
    # Force bash (present in ubuntu:22.04) for every run step.
    defaults:
      run:
        shell: bash
    timeout-minutes: 360
    steps:
      # bare ubuntu image lacks git/sudo/ca-certificates; runner's portable
      # git fallback covers checkout, but install explicitly to be safe
      - name: Bootstrap container (git + sudo + certs)
        run: |
          apt-get update -qq
          apt-get install -y -qq git sudo ca-certificates python3
          # SDK scripts (defconfig_hook.py, repo, build helpers) use
          # '#!/usr/bin/env python'; bare 22.04 only ships python3.
          ln -sf /usr/bin/python3 /usr/bin/python
          python --version
          git --version

      - name: Checkout project (S4602 assets)
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            repo build-essential bc bison flex libssl-dev libncurses-dev \
            file rsync unzip wget cpio gawk xz-utils device-tree-compiler \
            python3-dev perl patch swig libconfuse-dev curl cmake
          # ubuntu-26.04 ships gcc-15 whose DEFAULT -std is C23: old-style
          # K&R declarations break in every 2022-era host tool (m4, python,
          # ninja, gettext, bash mkbuiltins, ...). Per-package patches are
          # whack-a-mole; instead force the system default gcc to a gnu17
          # compiler (gcc-14/13/12 all default to gnu17). Existing per-package
          # patches stay as harmless double insurance.
          for V in 14 13 12; do
            if sudo apt-get install -y "gcc-$V" "g++-$V" 2>/dev/null; then
              sudo update-alternatives --install /usr/bin/gcc gcc "/usr/bin/gcc-$V" 200
              sudo update-alternatives --install /usr/bin/g++ g++ "/usr/bin/g++-$V" 200
              echo "default host gcc switched to gcc-$V"
              break
            fi
          done
          gcc --version | head -1
          g++ --version | head -1
          # gstreamer 1.14.x (gstreamer1/gst1-plugins-base/good/bad/ugly)
          # relies on make <=4.2 eating the '\#' escape in glib-mkenums
          # --fhead templates. make 4.3 (22.04 default) leaves it in the
          # generated code -> stray '\#include' (Gentoo bug 705974).
          # Build make 4.2.1 into /usr/local/bin so it shadows /usr/bin/make.
          cd /tmp
          curl -fsSL --retry 3 -o make-4.2.1.tar.gz \
            https://ftp.gnu.org/gnu/make/make-4.2.1.tar.gz \
            || curl -fsSL --retry 3 -o make-4.2.1.tar.gz \
            https://sources.buildroot.net/make/make-4.2.1.tar.gz
          tar xzf make-4.2.1.tar.gz
          cd make-4.2.1
          ./configure --prefix=/usr/local >/dev/null
          make -j$(nproc) >/dev/null
          sudo make install >/dev/null
          hash -r
          cd "$GITHUB_WORKSPACE"
          command -v make && make --version | head -1
          repo --version 2>/dev/null || {
            curl -s https://storage.googleapis.com/git-repo-downloads/repo \
              | sudo tee /usr/local/bin/repo >/dev/null
            sudo chmod a+x /usr/local/bin/repo
            repo --version
          }

      - name: repo init (pinned BSP manifest)
        run: |
          # /mnt is root-owned on ubuntu-latest: create + hand to runner user
          sudo mkdir -p "$SDK_DIR"
          sudo chown -R "$(id -u):$(id -g)" /mnt
          cd "$SDK_DIR"
          repo init -u "$FL_GROUP/manifests.git" -b master \
            -m rv1126_rv1109/rv1126_rv1109_linux_release_20241011_v2.2.5g.xml \
            --depth=1 2>&1 | tail -5
          grep -E 'revision|name="buildroot"' .repo/manifests/rv1126_rv1109/rv1126_rv1109_linux_release_20241011_v2.2.5g.xml

      - name: repo sync (full project set minus host-only repos)
        run: |
          cd "$SDK_DIR"
          set -o pipefail
          time repo sync -c -j4 \
            buildroot buildroot-dl device/rockchip rkbin \
            prebuilts/gcc/linux-x86/arm/gcc-arm-8.3-2019.03-x86_64-arm-linux-gnueabihf \
            external/CallFunIpc external/alsa-config external/app external/avb \
            external/ble_wificonfig external/bluetooth_bsa external/broadcom_bsa \
            external/camera_engine_rkaiq external/common_algorithm \
            external/deviceio_release external/eq_drc_process \
            external/gstreamer-rockchip external/isp2-ipc external/ladspaSDK \
            external/linux-rga external/minilogger external/mpp \
            external/pcba_adb_test external/recovery external/rk_pcba_test \
            external/rkadk external/rkmedia external/rknpu external/rkscript \
            external/rktoolkit external/rkupdate external/rkwifibt \
            external/rockit external/rockx \
            external/security/bin external/security/rk_tee_user \
            external/uac_app external/uvc_app \
            app/CameraFactoryTestServer app/QFacialGate app/QLauncher \
            app/aiserver app/camera app/cvr_app app/dbserver app/dbtool \
            app/firefly_rkmedia_demo app/firefly_rkmedia_uvc \
            app/firefly_rockx_demo app/ipc-daemon app/ipcweb-backend \
            app/ipcweb-ng app/libIPCProtocol app/libgdbus app/librkdb \
            app/mediaserver app/minigui_demo app/multivideoplayer \
            app/netserver app/qcamera app/qfm app/qplayer app/qsetting \
            app/rkaiq_switch_mode app/rkaiq_tool_server \
            app/smart_display_service app/startup_app_ipc \
            app/storage_manager app/video 2>&1 | tail -30
          df -h /mnt

      - name: Gate - verify local-site package sources present
        run: |
          cd "$SDK_DIR"
          for d in \
            external/camera_engine_rkaiq external/rkmedia external/mpp \
            external/linux-rga external/common_algorithm external/eq_drc_process \
            external/ladspaSDK external/rkwifibt external/rockx external/rknpu \
            external/rkscript external/isp2-ipc external/CallFunIpc \
            external/minilogger external/pcba_adb_test external/rk_pcba_test \
            external/rkupdate external/gstreamer-rockchip \
            app/ipcweb-backend app/dbserver app/librkdb app/libIPCProtocol \
            app/libgdbus app/netserver app/storage_manager app/mediaserver \
            app/ipc-daemon app/rkaiq_switch_mode app/firefly_rkmedia_demo \
            app/startup_app_ipc ; do
            test -d "$d" || { echo "MISSING: $d"; exit 1; }
          done
          echo "all local-site sources present"

      - name: Inject S4602 assets (IQ file + overlay)
        run: |
          set -e
          # IQ file lives in the rkaiq repo at SDK ROOT, not under buildroot/
          test -d "$SDK_DIR/external/camera_engine_rkaiq/iqfiles" \
            || { echo "FATAL: $SDK_DIR/external/camera_engine_rkaiq/iqfiles missing"; exit 1; }
          cp -v "$GITHUB_WORKSPACE/board/s4602/firefly/iqfiles/sc5338_CMCC-S4602_DEFAULT.xml" \
                "$SDK_DIR/external/camera_engine_rkaiq/iqfiles/"
          # S4602 overlay (BR2_ROOTFS_OVERLAY is relative to buildroot root)
          mkdir -p "$SDK_DIR/buildroot/board/s4602-overlay/etc/iqfiles"
          cp -v "$GITHUB_WORKSPACE/board/s4602/firefly/iqfiles/sc5338_CMCC-S4602_DEFAULT.xml" \
                "$SDK_DIR/buildroot/board/s4602-overlay/etc/iqfiles/"
          # host tool patches for modern glibc (glibc >= 2.34: SIGSTKSZ is a
          # function call, breaks old gnulib #if in host-m4 1.4.18)
          cp -v "$GITHUB_WORKSPACE/board/s4602/firefly/buildroot-patches/m4-"*.patch \
                "$SDK_DIR/buildroot/package/m4/"
          # host-python 2.7.16: C23 keyword clash in Include/asdl.h
          cp -v "$GITHUB_WORKSPACE/board/s4602/firefly/buildroot-patches/host-python-"*.patch \
                "$SDK_DIR/buildroot/package/python/"
          # host-python vs modern gcc (C23 default): force gnu17 for the whole
          # host build (asdl.h fixed by patch; math module and other exts need
          # this too). CFLAGS flows from configure into Makefile + sharedmods.
          sed -i 's|ac_cv_prog_HAS_HG=/bin/false \\|ac_cv_prog_HAS_HG=/bin/false \\\n\tCFLAGS="$(HOST_CFLAGS) -std=gnu17" \\|' \
                "$SDK_DIR/buildroot/package/python/python.mk"
          grep -n "std=gnu17" "$SDK_DIR/buildroot/package/python/python.mk"
          # host-ninja 1.8.2: configure.py imports 'pipes' (removed in Python 3.13)
          cp -v "$GITHUB_WORKSPACE/board/s4602/firefly/buildroot-patches/host-ninja-"*.patch \
                "$SDK_DIR/buildroot/package/ninja/"
          # host-gettext 0.19.8.1: old-style 'char *getcwd ();' conflicts with
          # glibc fortify prototype under C23-default gcc
          cp -v "$GITHUB_WORKSPACE/board/s4602/firefly/buildroot-patches/host-gettext-"*.patch \
                "$SDK_DIR/buildroot/package/gettext/"
          # gettext 0.19.8.1 has many old-style () declarations (x-javascript.c
          # phase5_scan_regexp, dcigettext getcwd, ...). Force gnu17 for the
          # whole host build instead of patching files one by one.
          sed -i 's|HOST_GETTEXT_DEPENDENCIES = host-libxml2|HOST_GETTEXT_DEPENDENCIES = host-libxml2\nHOST_GETTEXT_CONF_ENV = CFLAGS="$(HOST_CFLAGS) -std=gnu17"|' \
                "$SDK_DIR/buildroot/package/gettext/gettext.mk"
          grep -n "std=gnu17" "$SDK_DIR/buildroot/package/gettext/gettext.mk"
          ls "$SDK_DIR/buildroot/package/m4/" "$SDK_DIR/buildroot/package/python/" "$SDK_DIR/buildroot/package/ninja/" | head -25
          # Prefetch stale distro sources (sourceforge wiped libpng 1.6.37;
          # buildroot.net keeps it under package subdir). NOTE: this old
          # buildroot (2022.x) uses FLAT dl dir - no per-package subdir.
          mkdir -p "$SDK_DIR/buildroot/dl"
          test -f "$SDK_DIR/buildroot/dl/libpng-1.6.37.tar.xz" \
            || curl -fsSL --retry 3 \
                 -o "$SDK_DIR/buildroot/dl/libpng-1.6.37.tar.xz" \
                 https://sources.buildroot.net/libpng/libpng-1.6.37.tar.xz
          ls -la "$SDK_DIR/buildroot/dl/libpng-1.6.37.tar.xz"
          sha256sum "$SDK_DIR/buildroot/dl/libpng-1.6.37.tar.xz"
          ls "$SDK_DIR/external/camera_engine_rkaiq/iqfiles/" | grep sc5338
          # diagnostic: confirm which ref the sync actually checked out
          git -C "$SDK_DIR/external/camera_engine_rkaiq" log --oneline -1
          git -C "$SDK_DIR/buildroot" log --oneline -1

      - name: Expand defconfig includes + configure buildroot
        run: |
          cd "$SDK_DIR/buildroot"
          python3 "$GITHUB_WORKSPACE/tools/expand_buildroot_defconfig.py" \
            . "$GITHUB_WORKSPACE/board/s4602/firefly/s4602_rootfs_defconfig" \
            s4602_rootfs_expanded_defconfig
          # sanity: expansion must NOT contain residual #include lines
          ! grep -c '^#include' configs/s4602_rootfs_expanded_defconfig || {
            echo "ERROR: residual #include in expanded defconfig"; exit 1; }
          # key overrides must be present AFTER the included base (last-wins)
          tail -8 configs/s4602_rootfs_expanded_defconfig
          grep -q 'BR2_PACKAGE_CAMERA_ENGINE_RKAIQ_IQFILE="sc5338_CMCC-S4602_DEFAULT.xml"' \
            configs/s4602_rootfs_expanded_defconfig \
            || { echo "ERROR: IQ override lost in expansion"; exit 1; }
          # diagnostics: env probe + FULL defconfig log (tail -5 swallowed the
          # real error last round - "No rule to make target .br-external.mk")
          make --version | head -1
          umask
          ls -l support/scripts/br2-external
          bash --version | head -1
          # Pre-seed output/.br-external.mk: on 22.04+make4.3 the $(shell
          # br2-external ...) inside the Makefile silently produces nothing
          # (no stderr, no file - run 44494114293), while make4.4/26.04 works.
          # With the file present, the include pair succeeds regardless:
          # make's own $(shell) either regenerates it or truncates it (exec >
          # happens before any failure) - both are fine, we have no external
          # trees. The manual probe RC tells us if the script runs at all.
          mkdir -p output
          /bin/sh -c './support/scripts/br2-external -m -o output/.br-external.mk'
          echo "manual br2-external probe RC=$?"
          ls -la output/.br-external.mk || touch output/.br-external.mk
          head -3 output/.br-external.mk
          make s4602_rootfs_expanded_defconfig > /tmp/defconfig.log 2>&1 || {
            echo "=== make defconfig failed, FULL log ==="
            cat /tmp/defconfig.log
            exit 1
          }
          tail -5 /tmp/defconfig.log
          # verify final .config kept the S4602 overrides
          grep -E 'BR2_TARGET_GENERIC_ROOT_PASSWD|RKAIQ_IQFILE|HOSTNAME' .config

      - name: Build rootfs
        run: |
          cd "$SDK_DIR/buildroot"
          # hard gate: external toolchain must exist before make (fail fast)
          TC="$SDK_DIR/prebuilts/gcc/linux-x86/arm/gcc-arm-8.3-2019.03-x86_64-arm-linux-gnueabihf/bin/arm-linux-gnueabihf-gcc"
          test -x "$TC" || { echo "FATAL: external cross-compiler missing at $TC (prebuilts not synced?)"; exit 1; }
          "$TC" --version | head -1
          # CMake >= 4.0 on the runner removed <3.5 minimum-version compat;
          # 2022-era SDK packages (mpp/rkaiq/rkmedia/QT5 ...) all declare old
          # minimums. Env var (supported by CMake >= 4.0) exempts them all.
          export CMAKE_POLICY_VERSION_MINIMUM=3.5
          # container runs as root; GNU tar 1.29 configure refuses root
          # (buildroot's documented Docker workaround)
          export FORCE_UNSAFE_CONFIGURE=1
          cmake --version | head -1
          # full log to file; never let -e/pipefail skip diagnostics
          set +e
          make -j$(nproc) CMAKE_POLICY_VERSION_MINIMUM=3.5 > /tmp/make.log 2>&1
          RC=$?
          tail -40 /tmp/make.log
          if [ $RC -ne 0 ]; then
            echo "=== make exited $RC, error context ==="
            grep -nE "error:|Error [0-9]|Failed to build" /tmp/make.log | tail -30
            echo "=== context around math/ext build failures ==="
            grep -n -B3 -A20 "Failed to build" /tmp/make.log | tail -60
          fi
          exit $RC

      - name: Upload make log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: make-log-${{ github.run_id }}
          path: /tmp/make.log
          if-no-files-found: ignore

      - name: Gate - image + installed payload checks
        run: |
          cd "$SDK_DIR/buildroot"
          test -f output/images/rootfs.ext4 || { echo "no rootfs.ext4"; exit 1; }
          test -f output/images/rootfs.squashfs || { echo "no rootfs.squashfs"; exit 1; }
          echo "=== target payload ==="
          test -d output/target/etc/iqfiles && ls output/target/etc/iqfiles/ | grep -i sc5338 \
            || echo "WARN: no sc5338 xml in target /etc/iqfiles (check rkaiq install path)"
          for p in \
            output/target/usr/lib/librkaiq.so* \
            output/target/usr/lib/librkmedia.so* \
            output/target/usr/lib/librockchip_mpp.so* \
            output/target/usr/bin/dropbearmulti ; do
            ls $p 2>/dev/null || echo "WARN: missing $p"
          done
          du -sh output/images/rootfs.ext4 output/images/rootfs.squashfs output/target

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: s4602-firefly-rootfs
          path: |
            /mnt/fl-sdk/buildroot/output/images/rootfs.ext4
            /mnt/fl-sdk/buildroot/output/images/rootfs.squashfs
          retention-days: 30
          compression-level: 6
