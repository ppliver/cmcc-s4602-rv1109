# 证据：qianliyan原厂固件启动信息.log / s4602变砖过程_20260629_133651.txt /
#       移动千里眼S4602原厂固件备份/ → 详见 docs/INCIDENT.md

board:
  model: "CMCC S4602 (移动千里眼)"
  soc: "rv1109"
  soc_id_from_kernel: "11090000"   # rockchip-cpuinfo，确证 RV1109；DTB 写 rv1126 是共用 BSP
  openipc_vendor: "rockchip"
  openipc_family: "rv11xx"
  openipc_defconfig: "rv1109_lite_defconfig"

# ---- 当前设备状态（决定能否生成任何写命令）----
device_state:
  status: "operational"           # 2026-11-12：全新同款机，原厂固件正常启动，COM4 已接 UART
  console_reachable_now: true      # 已进 U-Boot "=>" 提示符（uboot_intercept 截停 autoboot）
  vendor_restored: true            # 设备本就运行原厂固件，无需救砖
  # 语义：有「干净且可恢复」的 loader 备份。仅把 0x0-0x300000 读出来不算——
  # ⑨ 从 offset 0 误写过整片，现场补读的内容可能已污染，须按 FULL_BACKUP.md 第 8 节双来源比对
  loader_area_backed_up: true
  last_log: "docs/evidence/live-boot-com4-20261112.log + live-uboot-diag-20261112.txt"
  note: "全新机，非砖机；全片备份已归档 backup/snapshot/full-256M.img。2026-11-12 已用 SD 通道刷 OpenIPC 到 _b 槽并启动成功（UBIFS 挂载 + sc5338 Detected SCce50）；_a 原厂保留回滚。"

