# ---- U-Boot 能力（2026-06-29 help / printenv 实测，指变砖之前的状态）----
uboot:
  reuse_vendor_loader: true
  needs_custom_uboot: false        # 实证：SPL/ddr bin 至今仍在运行，不需要重建 bootloader
  loader_recoverable_from_backup: false  # 备份不含 0x20000-0x300000 的 SPL/ddr bin
  console_interruptible: true     # 变砖前：Ctrl+C 可进 "=>"
  has_tftp: true
  has_nand: false                 # "nand erase" -> no devices available
  has_mtd: true                   # "mtd read/write/erase spi-nand0 ..." 可用
  has_ubi: false                  # "ubi part" -> Unknown command
  has_ubifsload: false
  has_fatload: true
  has_rockusb: true               # help 里有 rockusb / download
  has_saveenv: false              # saveenv 不存在；env save 只打印 usage
  env_persistent: false           # 启动横幅 "Using default environment"，重启即恢复默认
  secure_boot: false              # "## Verified-boot: 0"
  bootcmd_original: "boot_fit;boot_android ${devtype} ${devnum};"
  bootargs_original: "storagemedia=mtd androidboot.storagemedia=mtd androidboot.mode=normal"
  commands_raw: "见 s4602变砖过程_20260629_133651.txt:1160-1242 (help) 与 :1243-1288 (printenv)"

# ---- 引导链判定（2026-11-11 按 mkimg 源码 + 7 次 cmdline 实证，见 docs/BOOT_FEASIBILITY.md）----
boot_chain:
  uboot_can_boot_openipc_kernel: true    # 能；不用编译、不用替换、不用改 env
  boot_fit_accepts_fit_only: true        # bootcmd=boot_fit，只认 FIT
  vendor_boot_img_is_fit: true           # boot_a.img magic d00dfeed, file=Device Tree Blob v17
  vendor_fit_template: "移动千里眼S4602原厂固件备份/boot_a.img"
  vendor_fit_data_offset: "0x800"        # 与 mkimg 的 mkimage -E -p 0x800 一致
  openipc_zboot_default_format: "android-boot-img"   # mkimg 默认走 make_boot_img
  openipc_zboot_need_repack_itb: true    # 必须传 BOOT_IMG=模板 才产出 FIT
  uboot_injects_bootargs: true           # 7 次启动实测；setenv bootargs 改不动 root=
  injected_root: "root=/dev/ubiblock0_0 rootfstype=squashfs ubi.mtd=9 ubi.block=0,rootfs"
  vendor_rootfs_fs: "squashfs"           # system_* 卷内 hsqs @0x41000
  openipc_rootfs_fs: "ubifs"             # rootfs.ubi.rv1109 卷内 UBIFS
  cmdline_force_required: true           # CONFIG_CMDLINE_FORCE=y + 内置 mtdparts 串
  active_slot: "b"                       # android_slotsufix=_b / ubi.mtd=9 / boot_fit 读 boot_b
  kernel_storage_config: "RK_SFC_NAND=y, MTD_UBI=y, UBIFS_FS=y, SQUASHFS=y, MTD_CMDLINE_PARTS=y"

# ---- 尚未解决的 blocker（make_flash_plan.py 检查前 3 项，全 true 才放行）----
openipc_blockers:
  fit_image_built_and_verified: true     # CI run 43177394588 产出 zboot.img.s4602：FIT 魔数 d00dfeed、3.38MiB<4MiB
  bootargs_strategy_verified: true       # 策略已实现：CONFIG_CMDLINE_FORCE=y+内置 UBIFS cmdline+mtdparts，待 L2-a 实机确认
  slot_strategy_confirmed: true          # 已定：刷 _b 槽（ubi.mtd=9），_a 留原厂回滚（回滚=从备份恢复 boot_b/system_b）
  sensor_driver_available: true          # sc5338.c 已编入 CI 内核（CONFIG_VIDEO_SC5338=y）；出图仍待 rkaiq IQ/3A XML + 实板验证

# ---- 刷写目标（由 make_flash_plan.py 依据上表计算，勿手填）----
flash_plan:
  kernel_partition:
    # 已定刷 _b 槽：U-Boot 活动槽写死为 _b（SPL 打印 android_slotsufix=_b，env 无此变量；
    # misc 全 0xFF），且不碰 uboot/loader，故设备永远只认 _b。_a 留原厂回滚。
    offset: "0x00A00000"          # boot_b
    size: "0x00400000"
  rootfs_partition:
    offset: "0x03A80000"          # system_b = MTD 9（ubi.mtd=9）
    size: "0x02c00000"
  load_addr: "0x1000000"          # 实测可用；0x02008000 会与 FIT kernel load 冲突
  rootfs_image: "firmware/rootfs.ubi.rv1109"
  rootfs_md5: "a9052a434652eb7f7d4895c61479c95e"   # CI run 43177394588 nightly rootfs.ubi.rv1109（原 11-02 值为 5c1849f7…；nightly 每日重建致 md5 漂移）
  rootfs_write_size: "0x780000"   # = 7,864,320 B，必须用真实文件长度，不是分区大小
  # 不能靠 setenv bootargs：U-Boot 强制注入 root=/dev/ubiblock0_0 rootfstype=squashfs。
  # 已用内核 CONFIG_CMDLINE_FORCE=y + 内置完整 cmdline（见 s4602_kernel_fragment.config）。
  bootargs_openipc: "earlycon=uart8250,mmio32,0xff570000 console=ttyFIQ0,1500000 ubi.mtd=9 root=ubi0:rootfs rootfstype=ubifs mtdparts=spi-nand0:0x20000@0x0(gpt),0x100000@0x300000(uboot_a),0x100000@0x400000(uboot_b),0x80000@0x500000(devinfo_a),0x80000@0x580000(devinfo_b),0x400000@0x600000(boot_a),0x400000@0xa00000(boot_b),0x80000@0xe00000(misc),0x2c00000@0xe80000(system_a),0x2c00000@0x3a80000(system_b),0x5a00000@0x6680000(model),0xf00000@0xc080000(log),0x1800000@0xcf80000(data),0x17e0000@0xe780000(data_bk)"
  backup_verified: true           # 2026-11-12 全片 256MiB 备份已归档 backup/snapshot/，含 loader 区与 GPT 备表
