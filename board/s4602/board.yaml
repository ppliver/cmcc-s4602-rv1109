  kernel_image: "zboot.img"
  kernel_dtb: "rv1109-38x38-v10-spi-nand-imx307.img"
  baseline_board: "Longse RV1109 38x38 V10 SPI-NAND + IMX307 + DDR3"
  nightly_tag: "nightly-20261110-9dc02de"
  nightly_package: "openipc.rv1109-nand-lite.tgz"
  ubi_peb_bytes: 131072
  ubi_leb_bytes: 126976
  ubi_min_io: 2048
  ubi_volumes: ["rootfs", "rootfs_data"]
