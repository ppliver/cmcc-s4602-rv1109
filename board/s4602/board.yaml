# ---- 硬件实测（2026-06-29 串口日志）----
hardware:
  ddr_type: "LPDDR4"               # SPL: LPDDR4 / DTB model 里的 "DDR3 Board" 是模板残留
  ddr_size_mib: 512
  ddr_freq_mhz: 924
  ddr_bin_version: "DDR Version V1.08 20210825"
  spi_nand_id: "e5 f2 e5"          # dmesg: sfc_nand id
  spi_nand_size_mib: 256
  sensor: "SmartSens SC5338"       # dmesg: Detected SC00ce50 sensor
  sensor_id: "0x00ce50"            # 0x3107=0xce / 0x3108=0x50
  sensor_i2c: "i2c1@0x30"
  sensor_lanes: 2
  sensor_interface: "mipi-csi2"
  sensor_resolution: "2880x1620 RAW10"   # linear 30fps / WDR 2-frame 15fps
  sensor_hdr_mode: "HDR_X2 = 5"          # rk-camera-module.h: NO_HDR=0, HDR_X2=5, HDR_X3=6
  sensor_module: "CMK-OT1607-FV1 / M12-40IRC-4MP-F16"
  sensor_materials: "docs/SC5338.md"     # 规格/DTB/驱动/寄存器表/移植清单
  audio_codec: "ES7202 (PDM)"
  rtc: "PCF8563 i2c4@0x51"
  phy: "外置 PHY (stmmac/GMAC, integrated PHY? no)"  # 笔记写 YT8512B，DTB 未确证
  phy_speed: "100Mbps full-duplex"
  mac: "48:E5:33:DB:EF:5B"
  # CPU efuse 派生（rockchip-cpuinfo Serial / U-Boot serial#），不在 flash 分区里，无需备份
  serial: "3d99410429e09d59"
  # flash 中真正需要保护的身份字段：devinfo_a/b @0x34 的 MAC、data 分区的 sn= 业务设备码
  business_sn_prefix: "68Gg6mgTpkeweYxyHj8X4whT"
  uart_baud: 1500000
  uart_voltage: 3.3
  console: "ttyFIQ0"

# ---- 原厂固件实测 ----
vendor_firmware:
  uboot: "U-Boot 2017.09 (Oct 28 2021) + SPL 2017.09-g61c5d7f (Jun 09 2023)"
  optee: "OP-TEE 3.6.0-312-gee120571"
  kernel: "Linux 4.19.111 #47 SMP PREEMPT (Jan 10 2024, Linaro GCC 6.3.1)"
  rootfs: "squashfs in UBI volume rootfs, mounted via /dev/ubiblock0_0"
  verified_boot: false             # SPL: "## Verified-boot: 0"; FIT 内有 sha256 但无公钥签名
  fit_signed: false                # "FIT: no signed, no conf required"
  active_slot: "_b"                # SPL: A/B-slot: _b, successful: 1
  bootcmd: "boot_fit;boot_android ${devtype} ${devnum};"
  bootargs: "user_debug=31 storagemedia=mtd androidboot.storagemedia=mtd androidboot.mode=normal android_slotsufix=_b root=/dev/ubiblock0_0 coherent_pool=64K earlycon=uart8250,mmio32,0xff570000 console=ttyFIQ0 ubi.mtd=9 ubi.block=0,rootfs rootfstype=squashfs snd_aloop.index=7"
  kernel_load_addr: "0x02008000"
  fdt_load_addr: "0x08300000"
  fit_in_boot_partition: true
  backup_dir: "移动千里眼S4602原厂固件备份"

# ---- Flash 与分区（GPT / mtdparts / 备份三方一致）----
