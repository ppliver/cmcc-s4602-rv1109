# UBI 卷布局 —— 官方 rv1109-nand-lite 实际使用的布局（已由 nightly 镜像解析确认）
# 证据：ubireader_display_info → 60 PEB / 58 data / 2 layout，
#       vol 0 = rootfs (UBIFS, reserved 265 PEB), vol 1 = rootfs_data (autoresize)
# 来源：OpenIPC/firmware general/scripts/ubifs/ubinize.cfg
#
# 2026-11-11 实测确认：S4602 原厂 system_a/b 分区的 UBI 几何与本配置完全一致
#   dmesg: PEB 131072 / LEB 126976 / min-max I/O 2048 / sub-page 2048 /
#          VID header offset 2048 / data offset 4096 / 352 PEB per 44 MiB partition
#   → 官方 rootfs.ubi 可以直接写进 system_a (0xe80000)，无需改 ubinize 参数。
#   → 但写入长度必须是镜像真实字节数 0x780000 (7,864,320 B)，不是分区大小 0x2c00000。
#
# 差异：原厂是「UBI 卷 rootfs 内放 squashfs，经 ubi.block=0,rootfs 挂 /dev/ubiblock0_0」；
#       OpenIPC 是「UBI 卷内直接 UBIFS，root=ubi0:rootfs rootfstype=ubifs」。
#       两者 UBI 几何相同，但 bootargs 完全不同，见 docs/RECOVERY.md 3.3。
# 仓库里另有未使用的 4 卷 ubinize_rockchip.cfg（kernel=zboot.img / rootfs=squashfs / ...），
# 那是 ubiblock 旧布局，当前 nightly 并未使用；本机内核在独立 boot 分区，不需要它。

[ubifs]
mode=ubi
vol_id=0
vol_type=dynamic
vol_name=rootfs
vol_alignment=1
vol_size=32MiB
image=BR2_ROOTFS_UBIFS_PATH

[data]
mode=ubi
vol_id=1
vol_type=dynamic
vol_name=rootfs_data
vol_alignment=1
vol_size=2MiB
vol_flags=autoresize
