# S4602 / RV1109 -- direct hardware H.264/H.265 RTP sender (no Windows relay).
# Edit CODEC, then:  sh /tmp/start_h264out.sh restart
# QGC source: CODEC=h264 -> "UDP h.264"  udp://0.0.0.0:5600
#             CODEC=h265 -> "UDP h.265"  udp265://0.0.0.0:5600
#
# Frame source: SRC=raw reads /dev/video0 (rkcif BG10 RAW10), converts to NV12
# in software, then hands it to the MPP hardware encoder. SRC=nv12 is the old
# rkispp_scale0 path and is BROKEN on this OpenIPC kernel (all-black NV12),
# kept only for reference. See docs/MPP_H264.md.

DST_IP=192.168.6.88
DST_PORT=5600

# h264 = RTP PT 96 (RFC 3984),  h265 = RTP PT 97 (RFC 7798)
CODEC=h264
SRC=raw

# Encoder output size. Software conversion cost scales with this:
#   320x180 ~ 14-24 fps, 480x270 ~ 12 fps, 640x360 ~ 7-9 fps (dual A7).
# Sensor itself runs at 26.67 fps. Use 320x180 for the lowest latency.
WIDTH=640
HEIGHT=360
DEV=/dev/video0

# Bayer box binning 2..8 (4 = 13.2fps; 8 same cost but no visible gain),
# chroma attenuation % (0 = greyscale).
# 2026-11-16: sensor CFA false colour is strong; 25% gives a usable picture
# (near-greyscale with a hint of colour). 100% produced unusable rainbow bands.
BOX=4
CHROMA=25
# Chroma wide-window half width (chroma pixels). Larger = cleaner/harder
# denoise of the rainbow speckle but softer colour. 7 = cleanest usable.
CBOX=7
# Grey-world auto white balance: 1 = freeze gains at 1.0 (no adaptive drift).
NOWB=0
# RAW->NV12 worker threads (1..2). The fast integer path needs 2 for 1080p30.
THREADS=2

# RC settings. FPS is the encoder's nominal rate; the RTP timestamps follow
# the real 90 kHz wall clock, so receivers never accumulate playout lag.
FPS=25
KBPS=1500
FRAMES=0

# Optional second UDP destination for verification (IP:PORT), empty to disable.
MIRROR=
